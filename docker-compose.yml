services:
  exam-app:
    build: .
    container_name: control-alt-defeat
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-cyberpunk-dev-secret}
      - CAD_PRODUCTION=1
    volumes:
      # Mount exams directory so you can add/edit exams without rebuilding
      - ./app/exams:/app/exams:ro
      # Persist the history database across container restarts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
